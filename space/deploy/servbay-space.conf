# Public traffic moved to the Linux production server. Private space.test remains local.
server {
    listen 80;
    server_name space.pub.test;
    return 302 https://bitcraft.ichaa.dev$request_uri;
}
server {
    listen 443 ssl;
    server_name space.pub.test;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate C:/ServBay/ssl/private/tls-certs/space.pub.test/space.pub.test.crt;
    ssl_certificate_key C:/ServBay/ssl/private/tls-certs/space.pub.test/space.pub.test.key;
    location ^~ /v1/ { return 410; }
    location / { return 302 https://bitcraft.ichaa.dev$request_uri; }
}
