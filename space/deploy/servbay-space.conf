# Apply through the ServBay website MCP/editor, not its generated NGINX files.
# Local Vite development remains on 5180 and playtest remains on 5181.
server {
    listen 80;
    server_name space.pub.test;
    return 301 https://space.ichaa.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name space.pub.test;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate C:/ServBay/ssl/private/tls-certs/space.pub.test/space.pub.test.crt;
    ssl_certificate_key C:/ServBay/ssl/private/tls-certs/space.pub.test/space.pub.test.key;
    root C:/laragon/www/dataverse/space/.runtime/published-web;
    index index.html;
    access_log logs/nginx/space.pub.test.log;

    location ^~ /v1/ {
        access_log off;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
