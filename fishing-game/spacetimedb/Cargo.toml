[package]
name = "fishing-game-module"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = "=2.10.2"
game-rules = { path = "../crates/game-rules" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
lto = true
opt-level = "s"
