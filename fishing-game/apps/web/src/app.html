<!doctype html>
<html lang="en" data-theme="light" data-palette="dockside">
	<head>
		<meta charset="utf-8" />
		<meta name="referrer" content="strict-origin-when-cross-origin" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script nonce="%sveltekit.nonce%">
			try {
				document.documentElement.dataset.theme = localStorage.getItem('fishbound:theme') === 'dark' ? 'dark' : 'light';
				const palette = localStorage.getItem('fishbound:palette');
				document.documentElement.dataset.palette = ['ocean', 'rose', 'cosmic', 'synthwave'].includes(palette) ? palette : 'dockside';
			} catch { /* Keep the default light theme when storage is unavailable. */ }
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
