server {
    listen 80;
    server_name fishbound.test;
    return 301 https://fish.ichaa.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name fishbound.test;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate C:/ServBay/ssl/private/tls-certs/fishbound.test/fishbound.test.crt;
    ssl_certificate_key C:/ServBay/ssl/private/tls-certs/fishbound.test/fishbound.test.key;
    access_log logs/nginx/fishbound.test.log;

    location = /v1/database/fishbound-dev-local/subscribe {
        access_log off;
        proxy_pass http://127.0.0.1:3127;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location = /v1/identity/websocket-token {
        access_log off;
        proxy_pass http://127.0.0.1:3127;
        proxy_buffering off;
    }
    location ^~ /v1/ { return 404; }

    location ^~ /auth/discord/ {
        access_log off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host fish.ichaa.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
    location = /health/account-link {
        proxy_pass http://127.0.0.1:3001/health/ready;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host fish.ichaa.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
}
