# Public website moved to Linux; the old OAuth callback remains for private local development.
server {
    listen 80;
    server_name fish.pub.test;
    return 302 https://fishbound.ichaa.dev$request_uri;
}
server {
    listen 443 ssl;
    server_name fish.pub.test;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate C:/ServBay/ssl/private/tls-certs/fish.pub.test/fish.pub.test.crt;
    ssl_certificate_key C:/ServBay/ssl/private/tls-certs/fish.pub.test/fish.pub.test.key;
    location ^~ /v1/ { return 410; }
    location ^~ /auth/discord/ {
        access_log off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host fish.ichaa.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
    location = /health/account-link {
        proxy_pass http://127.0.0.1:3001/health/ready;
    }
    location / { return 302 https://fishbound.ichaa.dev$request_uri; }
}
