[workspace]
resolver = "3"
members = ["crates/game-rules", "crates/game-client", "crates/discord-bot", "crates/account-link", "simulations"]
exclude = ["spacetimedb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
game-rules = { path = "crates/game-rules" }
game-client = { path = "crates/game-client" }
spacetimedb-sdk = "=2.12.0"
serenity = { version = "=0.12.5", default-features = false, features = ["client", "gateway", "model", "native_tls_backend"] }
poise = { version = "=0.7.0", default-features = false, features = ["handle_panics"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "signal", "net"] }
axum = "=0.8.9"
dotenvy = "=0.15.7"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[profile.dev]
debug = 0
strip = "debuginfo"
incremental = false

[profile.test]
debug = 0
strip = "debuginfo"
incremental = false

[profile.release]
debug = 0
strip = "debuginfo"
incremental = false

[profile.bench]
debug = 0
strip = "debuginfo"
incremental = false
