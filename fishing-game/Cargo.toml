[workspace]
resolver = "3"
members = ["crates/game-rules", "crates/game-client", "crates/discord-bot", "crates/account-link", "simulations"]
exclude = ["spacetimedb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
game-rules = { path = "crates/game-rules" }
game-client = { path = "crates/game-client" }
spacetimedb-sdk = "=2.10.2"
serenity = { version = "=0.12.5", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }
poise = { version = "=0.7.0", default-features = false, features = ["handle_panics"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "signal", "net"] }
axum = "=0.8.9"
dotenvy = "=0.15.7"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
